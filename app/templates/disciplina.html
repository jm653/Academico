{% extends "base.html" %}

{% block title %}Disciplinas{% endblock %}

{% block content %}
<h2>Disciplinas</h2>
{% for d in disciplinas %}
<div class="card mb-3">
    <div class="card-body">
        <h4>{{ d.nome }}</h4>
        <p>Curso: {{ d.curso.nome }}</p>
        <p>Instituição: {{ d.curso.instituicao.nome }}</p>
    </div>
</div>
{% endfor %}
{% endblock %}
