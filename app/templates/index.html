{% extends 'base.html' %}

{% block content %}

<h2 class="text-center mb-4">Dashboard</h2>

<div class="row">
    {% for pessoa in pessoas %}
    <div class="col-md-4 mb-3">
        <div class="card shadow">
            <div class="card-body">

                <h5>{{ pessoa.nome }}</h5>

                <p>
                    <strong>Email:</strong> {{ pessoa.email }} <br>
                    <strong>Cidade:</strong> {{ pessoa.cidade }} <br>
                    <strong>Ocupação:</strong> {{ pessoa.ocupacao }} <br>
                    <strong>CPF:</strong> {{ pessoa.cpf }} <br>
                    <strong>Nascimento:</strong> {{ pessoa.data_nasc }}
                </p>

                <a href="/pessoa/update/{{ pessoa.id }}/" class="btn btn-warning btn-sm">
                    Editar
                </a>

                <a href="/pessoa/delete/{{ pessoa.id }}/" 
                   class="btn btn-danger btn-sm"
                   onclick="return confirm('Tem certeza que deseja excluir?')">
                    Excluir
                </a>

            </div>
        </div>
    </div>
    {% endfor %}
</div>

{% endblock %}
