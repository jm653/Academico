<h2 class="mt-4 text-center">Pessoas</h2>

<table class="table">
<tr>
<th>Nome</th>
<th>Email</th>
<th>CPF</th>
<th>Cidade</th>
</tr>

{% for pessoa in pessoas %}
<tr>
<td>{{ pessoa.nome }}</td>
<td>{{ pessoa.email }}</td>
<td>{{ pessoa.cpf }}</td>
<td>{{ pessoa.cidade }}</td>
</tr>
{% endfor %}

</table>
